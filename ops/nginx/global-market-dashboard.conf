limit_req_zone $binary_remote_addr zone=dashboard_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dashboard_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_DIR__/dashboard;
    index index.html;
    autoindex off;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1m;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    limit_req zone=dashboard_per_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn dashboard_connections 12;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        limit_except GET {
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
