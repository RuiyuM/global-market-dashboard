limit_req_zone $binary_remote_addr zone=dashboard_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dashboard_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PUBLIC_IP__ "";

    root __APP_DIR__/dashboard;
    server_tokens off;

    limit_req zone=dashboard_per_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn dashboard_connections 12;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 403;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        return 308 https://__PUBLIC_IP__/;
    }

    location = /index.html {
        return 308 https://__PUBLIC_IP__/index.html;
    }

    location = /quant_fund.html {
        return 308 https://__PUBLIC_IP__/quant_fund.html;
    }

    location = /date {
        return 308 https://__PUBLIC_IP__/date/;
    }

    location ^~ /date/ {
        return 308 https://__PUBLIC_IP__$request_uri;
    }

    location = /thin-muscle-plan {
        return 308 https://__PUBLIC_IP__/thin-muscle-plan/;
    }

    location ^~ /thin-muscle-plan/ {
        return 308 https://__PUBLIC_IP__$request_uri;
    }

    location = /favicon.ico {
        return 308 https://__PUBLIC_IP__/favicon.ico;
    }

    location = /robots.txt {
        return 308 https://__PUBLIC_IP__/robots.txt;
    }

    location / {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __PUBLIC_IP__ "";

    ssl_certificate /etc/letsencrypt/live/__PUBLIC_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root __APP_DIR__/dashboard;
    index index.html;
    autoindex off;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1m;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    limit_req zone=dashboard_per_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn dashboard_connections 12;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /quant_fund.html {
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    location = /quant_fund_snapshot.json {
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    location = /date/api/pickup-draft {
        limit_except POST {
            deny all;
        }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8791/pickup-draft;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location = /date/api/invite-event {
        limit_except POST {
            deny all;
        }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8791/invite-event;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location = /thin-muscle-plan {
        return 308 /thin-muscle-plan/;
    }

    location ^~ /thin-muscle-plan/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8792/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /_next/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location ^~ /exercises/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /og.png {
        proxy_pass http://127.0.0.1:8792/og.png;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /favicon.svg {
        proxy_pass http://127.0.0.1:8792/favicon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_except GET {
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
